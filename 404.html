<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Martin Assaad</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#22262e;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:2rem}
.cube-wrap{perspective:700px;width:120px;height:120px;margin:0 auto 2rem}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube i{position:absolute;inset:0;border:2px solid #1fb6c1;background:rgba(31,182,193,.08);display:grid;place-items:center;font:600 1.4rem ui-monospace,Menlo,monospace;color:#1fb6c1}
.cube i:nth-child(1){transform:translateZ(60px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(60px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(60px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
h1{margin:0 0 .6rem;font-size:clamp(2.2rem,8vw,4rem);letter-spacing:-.03em}h1 span{color:#1fb6c1}
p{margin:0 0 2rem;color:#a7afbc;font-family:ui-monospace,Menlo,monospace}
a{display:inline-block;padding:.8rem 1.6rem;border-radius:999px;background:#1fb6c1;color:#02262b;font-weight:600;text-decoration:none;box-shadow:0 4px 0 #0e7f89}
a:active{transform:translateY(3px);box-shadow:0 1px 0 #0e7f89}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateX(-20deg) rotateY(30deg)}}
</style></head><body><main>
<div class="cube-wrap" aria-hidden="true"><div class="cube"><i>4</i><i>0</i><i>4</i><i>0</i><i>4</i><i>0</i></div></div>
<h1>404 <span>—</span> undefined dimension</h1>
<p>ReferenceError: this page is not defined.</p>
<a href="/">Return Home</a>
</main></body></html>
